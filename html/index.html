<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda Web</title>
    <link rel="stylesheet" href="../Style/Login.css">
</head> 
<body> 
    <div class="login-container">
        <form class="login-form">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa a tu agenda personal</p>
            
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <button type="button" onclick="manejarLogin()" class="btn-login">
                Entrar
            </button>
            
            <div class="footer-links">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

    <script>
        function manejarLogin() {
            
            const correoIngresado = document.getElementById('email').value;
            const passIngresada = document.getElementById('password').value;

            
            if (correoIngresado.trim() === "" || passIngresada.trim() === "") {
                alert("Por favor, completa todos los campos.");
                return;
            }

         
            localStorage.setItem('userEmail', correoIngresado);
            localStorage.setItem('userPass', passIngresada);

            
            window.location.href = 'contactos.html';
        }
    </script>
</body>
</html>
