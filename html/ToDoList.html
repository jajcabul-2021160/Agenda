<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List - Agenda Web</title>
    <link rel="stylesheet" href="../Style/ToDoList.css">
</head>
<body>
    <nav class="navbar">
        <h1>Mi Agenda</h1>
        <div class="nav-links">
            <a href="contactos.html">Contactos</a>
            <a href="Favoritos.html">Favoritos</a>
            <a href="Perfil.html">Perfil</a>
            <a href="ToDoList.html" class="active">Pendientes</a>
        </div>
    </nav>

    <main class="container">
        <div class="header-section">
            <h2>Mis Pendientes</h2>
        </div>

        <div class="todo-form">
            <input type="text" id="taskInput" placeholder="Nombre de la tarea...">
            <select id="priorityInput">
                <option value="1">Prioridad 1 (Alta)</option>
                <option value="2">Prioridad 2 (Media)</option>
                <option value="3">Prioridad 3 (Baja)</option>
            </select>
            <button onclick="addTask()" class="btn-add-task">Agregar</button>
        </div>

        <div id="taskList" class="task-list">
            </div>
    </main>

    <script>
        let tasks = [];

        function addTask() {
            const input = document.getElementById('taskInput');
            const priority = document.getElementById('priorityInput');

            if (input.value.trim() === "") {
                alert("Por favor escribe una tarea");
                return;
            }

            const newTask = {
                id: Date.now(),
                text: input.value,
                priority: parseInt(priority.value)
            };

            tasks.push(newTask);
            input.value = ""; 
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            renderTasks();
        }

        function editTask(id) {
            const taskToEdit = tasks.find(t => t.id === id);
            const newText = prompt("Editar tarea:", taskToEdit.text);
            
            if (newText !== null && newText.trim() !== "") {
                taskToEdit.text = newText;
                renderTasks();
            }
        }

        function renderTasks() {
            const listElement = document.getElementById('taskList');
            listElement.innerHTML = "";

            
            tasks.sort((a, b) => a.priority - b.priority);

            tasks.forEach(task => {
                const taskDiv = document.createElement('div');
                taskDiv.className = `task-item priority-${task.priority}`;
                
                taskDiv.innerHTML = `
                    <div class="task-info">
                        <span class="prio-badge">P${task.priority}</span>
                        <p>${task.text}</p>
                    </div>
                    <div class="task-actions">
                        <button class="btn-edit" onclick="editTask(${task.id})">✎</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">🗑</button>
                    </div>
                `;
                listElement.appendChild(taskDiv);
            });
        }
    </script>
</body>
</html>
