<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Agenda Web</title>
    <link rel="stylesheet" href="../Style/Perfil.css">
</head>
<body>
    <nav class="navbar">
        <h1>Mi Agenda</h1>
        <div class="nav-links">
            <a href="contactos.html">Contactos</a>
            <a href="Favoritos.html">Favoritos</a>
            <a href="Perfil.html" class="active">Perfil</a>
            <a href="ToDoList.html">ToDo List</a>
        </div>
    </nav>

    <main class="container">
        <div class="profile-layout">
            <div class="side-card">
              
                <button class="btn-logout" onclick="window.location.href='index.html'">Cerrar Sesión</button>
            </div>

            <div class="main-card">
                <h2>Información Personal</h2>
                <hr>
                <div class="details-grid">
                    <div class="detail-item">
                        <label>Datos presonales</label>
                        <p>---------------></p>
                    </div>
                    <div class="detail-item">
                        <label>Correo de Inicio de Sesión</label>
                        <p id="user-email-display">gerardo.alvarado@correo.com</p>
                    </div>
                    <div class="detail-item">
                        <label>Teléfono Personal</label>
                        <p>+502 1234-5678</p>
                    </div>
                    <div class="detail-item">
                        <label>Ubicación</label>
                        <p>zona 7 de la Ciudad de Guatemala</p>
                    </div>
                </div>

                <h2 style="margin-top: 30px;">Seguridad</h2>
                <hr>
                <div class="detail-item">
                    <label>Contraseña</label>
                    <p id="user-pass-display">******** <span class="change-link">(Cambiar)</span></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        
        window.onload = function() {
            
            const emailGuardado = localStorage.getItem('userEmail');
            const passGuardada = localStorage.getItem('userPass');

           
            if (emailGuardado) {
                document.getElementById('user-email-display').innerText = emailGuardado;
            }
            
            if (passGuardada) {
               
                document.getElementById('user-pass-display').innerHTML = passGuardada + ' <span class="change-link">(Cambiar)</span>';
            }
        };
    </script>
</body>
</html>
